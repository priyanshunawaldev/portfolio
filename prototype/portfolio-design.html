<!DOCTYPE html>
<!--
  PROTOTYPE v2 — throwaway. Answers: "What should the portfolio look like?"
  Refined after studying Rauno, Brittany Chiang, Arpit Bhayani, Osaf Ali Sayed.
  Three structurally different variants within ONE aesthetic:
    dark, minimal, monospace-accented, content-structured, backend-identity-forward.

  All variants avoid (per user brief): gradients, glassmorphism, 3D, huge animated
  hero text, scroll effects, endless badges, fake terminal typing, fake contribution
  graphs, fake stats, blinking cursors, unnecessary sections.
  Motion: a single one-time load fade, gated on prefers-reduced-motion.

  How to run: double-click this file, or:  start prototype\portfolio-design.html
  Flip with the floating bar or the ←/→ arrow keys. ?variant=A|B|C is shareable.

  NOTE on SEO: the real React build will render these meta tags server-side (or via
  react-helmet / Vite's index.html). They're included here to demonstrate the set.
-->

            <div class="mailrow">
              <a href="mailto:${esc(d.email)}">${esc(d.email)}</a>
              <button class="copy" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(d.email)}');this.textContent='copied';setTimeout(()=>this.textContent='copy',1200)">copy</button>
            </div>
            <div class="socials">
              <a href="https://${esc(d.github)}" target="_blank" rel="noopener">GitHub ↗</a>
              <a href="https://${esc(d.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>
            </div>
          </div></section>
        <footer>Built with React + Vite · ${new Date().getFullYear()}</footer>
      </div>
    </div>`;
  }

  // ---------- VARIANT C — Console (static, no blinking/typing) ----------
  function renderC(d) {
    const skills = d.skillGroups.map(g =>
      `<div class="sg"><span class="gc">${esc(g.cat.toLowerCase())}:</span> ${g.items.map(esc).join(', ')}</div>`).join('');
    const projects = d.projects.map(p =>
      `<div class="proj"><div class="ph"><h3>/${esc(p.title.toLowerCase())}</h3>
       <a class="src" href="https://${esc(p.url)}" target="_blank" rel="noopener">↗ source</a></div>
       <div class="desc">${esc(p.desc)}</div>
       <div class="stack">stack: <span class="sp">${p.stack.join(', ')}</span></div></div>`).join('');
    return `<div class="c rise">
      <div class="titlebar"><span class="dr r1"></span><span class="dr r2"></span><span class="dr r3"></span>
        <span class="tt">priyanshu@portfolio: ~</span></div>
      <div class="wrap">
        <div class="hero line">
<span class="prompt">$</span> <span class="cmd">whoami</span>
<span class="nm">${esc(d.name)}</span> <span class="dim">—</span> <span class="role">${esc(d.role)}</span>
<span class="dim">${esc(d.tagline)}</span>
<span class="prompt">$</span> <span class="cmd">cat avatar.png</span>
<div class="avatar">P N</div>
        </div>

        <div class="h" id="about">$ cat about.md</div>
        <div class="intro line">${esc(d.about)}</div>

        <div class="h" id="skills">$ skills --list</div>
        <div class="skills line">${skills}</div>

        <div class="h" id="projects">$ ls projects/</div>
        ${projects}

        <div class="contact line" id="contact">
          <div class="h">$ contact --send</div>
<span class="dim">email:</span>   <a href="mailto:${esc(d.email)}">${esc(d.email)}</a>
<span class="dim">linkedin:</span> <a href="https://${esc(d.linkedin)}" target="_blank" rel="noopener">${esc(d.linkedin)}</a>
<span class="dim">github:</span>  <a href="https://${esc(d.github)}" target="_blank" rel="noopener">${esc(d.github)}</a>
        </div>
        <footer><span>:wq · built with react + vite</span><span>exit 0</span></footer>
      </div>
    </div>`;
  }

  // ---- wiring ----
  const app = document.getElementById('app');
  const sclabel = document.getElementById('sclabel');
  const renderers = { A: renderA, B: renderB, C: renderC };

  function current() {
    const v = new URLSearchParams(location.search).get('variant');
    return (v && renderers[v.toUpperCase()]) ? v.toUpperCase() : 'A';
  }
  function setVariant(v) {
    app.innerHTML = renderers[v](DATA);
    sclabel.textContent = VARIANTS[v];
    const u = new URL(location); u.searchParams.set('variant', v);
    history.replaceState(null, '', u);
    app.scrollTop = 0;
  }
  function cycle(dir) {
    const order = ['A','B','C'];
    setVariant(order[(order.indexOf(current()) + dir + order.length) % order.length]);
  }
  document.getElementById('prev').onclick = () => cycle(-1);
  document.getElementById('next').onclick = () => cycle(1);
  document.addEventListener('keydown', e => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key === 'ArrowLeft') cycle(-1);
    if (e.key === 'ArrowRight') cycle(1);
  });
  setVariant(current());
</script>
</body>
</html>
