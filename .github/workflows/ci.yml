name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Sanity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify JavaScript & JSX Syntax
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            console.log('Verifying project integrity and structure...');
            const required = ['src/App.jsx', 'src/main.jsx', 'src/components/Hero.jsx', 'src/components/Projects.jsx', 'src/components/Skills.jsx', 'src/components/Contact.jsx'];
            for (const f of required) {
              if (!fs.existsSync(f)) {
                console.error('Missing required file: ' + f);
                process.exit(1);
              }
            }
            console.log('All required files verified.');
          "

      - name: Build Production Bundle
        run: npm run build

      - name: Check Output Integrity
        run: |
          test -d dist
          test -f dist/index.html
          echo "Production build verified successfully!"
